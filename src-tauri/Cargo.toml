[package]
name = "meerkat"
version = "0.1.0"
description = "Meerkat — an Activity Monitor alternative for Windows"
authors = ["TZZ"]
edition = "2021"
rust-version = "1.85"

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
# Toasts are sent straight to WinRT under Meerkat's own AppUserModelID (src/toast.rs). The
# notification plugin only knew that ID outside target/debug and target/release and headed
# every other toast "Windows PowerShell"; this is the crate it wraps, at the version already
# locked.
tauri-winrt-notification = "0.8"
tauri-plugin-autostart = "2.7"
# A second launch (a Start-menu click while Meerkat sits in the tray) must surface the running
# instance instead of starting another sampler and another set of tray icons.
tauri-plugin-single-instance = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only to turn an extracted icon into a PNG the webview can show, and to base64 it.
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network", "component", "multithread"] }
# The per-app timeline (apphistory.rs). Its own file, beside history.json rather than inside it:
# a minute of every busy app is far more rows than a JSON document that is rewritten whole on
# every flush can carry.
rusqlite = { version = "0.40", features = ["bundled"] }

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Power",
  "Win32_System_Performance",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Time",
  "Win32_System_SystemServices",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Services",
  "Wdk_System_SystemInformation",
  "Wdk_System_Threading",
  "Devices_Power",
  "Devices_Bluetooth",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Enumeration",
  "Foundation_Collections",
  "Storage_Streams",
  "Win32_System_EventLog",
  "Win32_System_Diagnostics_Debug",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_IO",
]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
panic = "abort"
