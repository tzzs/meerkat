[package]
name = "pulse"
version = "0.1.0"
description = "Pulse — an Activity Monitor alternative for Windows"
authors = ["TZZ"]
edition = "2021"
rust-version = "1.85"

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-autostart = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only to turn an extracted icon into a PNG the webview can show, and to base64 it.
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network", "component", "multithread"] }

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_System_Performance",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Time",
  "Win32_System_SystemServices",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Shell_PropertiesSystem",
]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
panic = "abort"
