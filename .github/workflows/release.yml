name: Release

on:
  push:
    tags: ["v*", "meerkat-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: cargo test
        working-directory: src-tauri
      - run: pnpm tauri build
      - run: pnpm package:portable
      - name: Publish the installer and the portable zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # A tag push carries the tag in GITHUB_REF_NAME; a manual run names it in the input.
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          $assets = @()
          $assets += @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue)
          $assets += @(Get-ChildItem "dist-portable/*.zip" -ErrorAction SilentlyContinue)
          if ($assets.Count -eq 0) { throw "no release assets were built" }
          # release-please creates the release and the tag together, so upload into it when it
          # is already there; a hand-cut tag still needs a release made here.
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets.FullName --clobber
          } else {
            $flags = @("--generate-notes", "--verify-tag")
            if ($tag -match "-") { $flags += "--prerelease" }
            gh release create $tag $assets.FullName @flags
          }
